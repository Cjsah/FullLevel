name: Mod Publish

on:
  release:
    types: [ published ]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      publish: 'true'
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: 'Artifacts'
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.jar

